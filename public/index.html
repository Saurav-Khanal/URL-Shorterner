<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Shorten your link</h1>
        <p>Share with them anyone</p>
        <h2>Turn long URL into short</h2>
        <div class="input-area">
            <p id="p1">Paste your long URL</p>
            <div class="link-input">
            <input type="text" placeholder="https://yourlongurl/sjffsfsasfdsasafsafasfsaf" required>
            <button>Shorten URL</button>
            </div>
        </div>
        <div class="result">
            <p id="p2">Your shortened link</p>
            <div class="link-container">
                <input type="text" id="shortenedLink" readonly>
                <button id="copybtn">
                    Copy
                </button>
            </div>
        </div>
    </div>
</body>
</html>
